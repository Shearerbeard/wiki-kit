[project]
name = "wiki-kit"
version = "0.1.0"
description = "Append-only wiki event store, deterministic projections, and garden tooling, installable into any content repo"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    "scripts/wiki-dock.py",
    "scripts/wiki-event.py",
    "scripts/wiki-garden.py",
    "scripts/wiki-gh-sweep.py",
    "scripts/wiki-memory-triage.py",
    "scripts/wiki-render.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
