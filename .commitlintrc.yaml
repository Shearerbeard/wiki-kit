# Conventional commit rules, inlined from @commitlint/config-conventional
# 19.8 so the repo needs no node_modules: the pre-commit commit-msg hook
# and a bare `npx -p @commitlint/cli commitlint --edit` both read this
# file as-is. CONTRIBUTING.md states the message rules in prose.
rules:
  body-leading-blank: [1, always]
  body-max-line-length: [2, always, 100]
  footer-leading-blank: [1, always]
  footer-max-line-length: [2, always, 100]
  header-max-length: [2, always, 100]
  header-trim: [2, always]
  subject-case: [2, never, [sentence-case, start-case, pascal-case, upper-case]]
  subject-empty: [2, never]
  subject-full-stop: [2, never, "."]
  type-case: [2, always, lower-case]
  type-empty: [2, never]
  type-enum: [2, always, [build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test]]
