# Prose-lint contract for kit docs. The style pack is optional
# maintainer tooling, never vendored: symlink your styles in with
#   ln -s /path/to/your/vale/styles .vale/styles
# (.vale/ is gitignored). Without the pack, Vale finds no styles and
# lints nothing; the kit's CI does not depend on it.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[formats]
COMMIT_EDITMSG = md

# Authored prose is linted: the kit docs, README, and schema registry
# notes.
[*.md]
BasedOnStyles = ai-tells, local
ai-tells.EmDashUsage = NO
ai-tells.FormalRegister = NO

[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits, local
ai-tells.EmDashUsage = NO
ai-tells.FormalRegister = NO
ai-tells-commits.CommitTestEnumeration = NO

# Test fixtures and templates are mechanical content, not authored prose.
[{tests/**,templates/**}]
BasedOnStyles =
