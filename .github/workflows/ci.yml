name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv run ruff check .
      - run: uv run pytest -q

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/install-smoke/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-smoke-report
          path: |
            reports/install-smoke/latest.md
            reports/install-smoke/latest.json
            reports/install-smoke/latest.log
